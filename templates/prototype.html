<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型 - __PROJECT_NAME__</title>
  <link href="lib/daisyui-themes.css" rel="stylesheet" />
  <link href="lib/daisyui.css" rel="stylesheet" />
  <script src="lib/tailwind.js"></script>
  <script src="lib/vue.global.prod.js"></script>
  <style>
    :root {
      --shell-header-h: 56px;
      --shell-sidebar-w: 240px;
    }
    html[data-theme="light"] {
      --color-base-100: #ffffff;
      --color-base-200: #f8f9fa;
      --color-base-300: #e9ecef;
      --color-base-content: #0f172a;
      --color-primary: #2563eb;
      --color-primary-content: #ffffff;
      --color-neutral: #f1f5f9;
      --color-neutral-content: #0f172a;
      --rounded-box: 0.5rem;
      --rounded-btn: 0.375rem;
      --rounded-selector: 0.25rem;
      --border-color: #e2e8f0;
    }
    /* 按钮样式 fallback：解决 daisyUI @layer 导致的 padding/height 失效 */
    .btn {
      padding-inline: 1rem !important;
      min-height: 2.5rem !important;
    }
    .btn-sm {
      padding-inline: 0.75rem !important;
      min-height: 2rem !important;
    }
    .btn-lg {
      padding-inline: 1.5rem !important;
      min-height: 3rem !important;
    }
    /* 视觉细节：零成本打磨（纯 CSS） */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, .card-title { text-wrap: balance; }
    p { text-wrap: pretty; }
    table { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app" class="flex h-screen overflow-hidden" style="background:var(--color-base-200)">
    <!-- 顶栏 -->
    <div class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 border-b" style="height:var(--shell-header-h);background:var(--color-base-100);border-color:var(--border-color)">
      <div class="flex items-center gap-3 min-w-[200px]">
        <div class="w-7 h-7 rounded-md flex items-center justify-center text-xs font-bold" style="background:var(--color-primary);color:var(--color-primary-content)">S</div>
        <div class="flex flex-col gap-0.5">
          <span class="text-sm font-semibold leading-tight">__PROJECT_NAME__</span>
          <span class="text-xs text-slate-500 leading-tight">统一业务工作台</span>
        </div>
      </div>
      <div class="flex-1 text-center text-sm text-slate-500 truncate px-6">当前模块 / 当前业务域</div>
      <div class="flex items-center gap-2 min-w-[200px] justify-end">
        <button class="btn btn-ghost btn-sm">帮助</button>
        <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs font-medium text-slate-600">U</div>
      </div>
    </div>

    <!-- 左侧导航 -->
    <aside class="fixed left-0 bottom-0 overflow-y-auto py-4 px-3" style="top:var(--shell-header-h);width:var(--shell-sidebar-w);background:var(--color-base-100);border-right:1px solid var(--border-color)">
      <div class="mb-4">
        <div class="px-3 pb-1.5 text-[11px] font-medium text-slate-400 uppercase tracking-wider">导航分组一</div>
        <ul class="menu menu-sm w-full p-0">
          <li><a :class="{'menu-active': currentPage === 'workspace'}" @click="go('workspace')">工作台</a></li>
          <li><a :class="{'menu-active': currentPage === 'module1'}" @click="go('module1')">一级模块一</a></li>
          <li><a :class="{'menu-active': currentPage === 'module2'}" @click="go('module2')">一级模块二</a></li>
        </ul>
      </div>
      <div class="mb-4">
        <div class="px-3 pb-1.5 text-[11px] font-medium text-slate-400 uppercase tracking-wider">导航分组二</div>
        <ul class="menu menu-sm w-full p-0">
          <li><a :class="{'menu-active': currentPage === 'module3'}" @click="go('module3')">一级模块三</a></li>
          <li><a :class="{'menu-active': currentPage === 'settings'}" @click="go('settings')">系统设置</a></li>
        </ul>
      </div>
    </aside>

    <!-- 主体区 -->
    <main class="flex-1 flex flex-col overflow-hidden" style="margin-left:var(--shell-sidebar-w);margin-top:var(--shell-header-h)">
      <!-- 页签栏（daisyUI tabs-bordered 原生组件） -->
      <div role="tablist" class="tabs tabs-bordered px-6 h-[52px]" style="background:var(--color-base-100)">
        <a v-for="key in openedTabs" :key="key"
           role="tab"
           class="tab gap-1"
           :class="{'tab-active': key === currentPage}"
           @click="go(key)">
          <span class="truncate max-w-[160px]">{{ pages[key].label }}</span>
          <span class="text-slate-400 hover:text-slate-700 cursor-pointer leading-none"
                @click.stop="closeTab(key)">&times;</span>
        </a>
      </div>

      <!-- 工作区：动态渲染当前页组件 -->
      <div class="flex-1 overflow-y-auto p-6">
        <component :is="currentPageComponent"></component>
      </div>
    </main>
  </div>

  <script>
    // 示例页面组件：工作台（展示基本结构，作为占位参考）
    const PageWorkspace = {
      template: `
        <div class="flex flex-col gap-4">
          <div class="card shadow-sm" style="background:var(--color-base-100)">
            <div class="card-body p-4">
              <h2 class="card-title text-sm font-medium">查询条件</h2>
              <div class="h-16 rounded border border-dashed border-slate-200 flex items-center justify-center text-sm text-slate-400">查询区占位</div>
            </div>
          </div>
          <div class="card shadow-sm min-h-[400px]" style="background:var(--color-base-100)">
            <div class="card-body p-4 flex items-center justify-center">
              <div class="text-center text-slate-400">
                <p class="text-sm">承载当前页面真正的业务内容</p>
                <p class="text-xs mt-1">可按需放查询区、操作区、列表区、表单区、详情区</p>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // 占位页面组件（其它模块共用）
    const PagePlaceholder = {
      template: `
        <div class="card shadow-sm min-h-[400px]" style="background:var(--color-base-100)">
          <div class="card-body p-4 flex items-center justify-center">
            <div class="text-center text-slate-400">
              <p class="text-sm">页面占位</p>
              <p class="text-xs mt-1">替换为当前模块业务内容</p>
            </div>
          </div>
        </div>
      `
    };

    // shell：只管路由 + 渲染容器，不持有页面业务数据
    const App = {
      data() {
        return {
          currentPage: 'workspace',
          openedTabs: ['workspace'],
          pages: {
            workspace: { label: '工作台', component: PageWorkspace },
            module1: { label: '一级模块一', component: PagePlaceholder },
            module2: { label: '一级模块二', component: PagePlaceholder },
            module3: { label: '一级模块三', component: PagePlaceholder },
            settings: { label: '系统设置', component: PagePlaceholder }
          }
        };
      },
      computed: {
        currentPageComponent() {
          return this.pages[this.currentPage].component;
        }
      },
      methods: {
        go(pageKey) {
          this.currentPage = pageKey;
          if (!this.openedTabs.includes(pageKey)) {
            this.openedTabs.push(pageKey);
          }
        },
        closeTab(pageKey) {
          const idx = this.openedTabs.indexOf(pageKey);
          if (idx === -1) return;
          this.openedTabs.splice(idx, 1);
          if (this.currentPage === pageKey) {
            if (this.openedTabs.length > 0) {
              this.currentPage = this.openedTabs[Math.max(0, idx - 1)];
            }
          }
        }
      }
    };

    Vue.createApp(App).mount('#app');
  </script>
</body>
</html>
