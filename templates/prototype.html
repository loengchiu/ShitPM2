<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__PROJECT_NAME__ · 原型</title>
<link rel="stylesheet" href="./lib/react-antd/reset.css" />
<link rel="stylesheet" href="./lib/react-antd/antd.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  .sider-logo {
    height: 48px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 16px; letter-spacing: 1px;
    white-space: nowrap; overflow: hidden;
  }
  .header-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: #fff; border-bottom: 1px solid #f0f0f0;
  }
  .content-wrap { padding: 24px; background: #f5f5f5; min-height: calc(100vh - 64px); }
  .page-head { margin-bottom: 16px; }
  .page-title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .page-sub { color: #8c8c8c; font-size: 13px; margin: 0; }
  .stat-card { height: 100%; }
  .chart-box {
    height: 260px; display: flex; align-items: center; justify-content: center;
    background: #fafafa; border: 1px dashed #d9d9d9; border-radius: 8px; color: #bfbfbf;
    font-size: 13px;
  }
  .toolbar { margin-bottom: 16px; }
  .footer-note { margin-top: 24px; text-align: center; color: #bfbfbf; font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="./lib/react-antd/react.production.min.js"></script>
<script src="./lib/react-antd/react-dom.production.min.js"></script>
<script src="./lib/react-antd/dayjs.min.js"></script>
<script src="./lib/react-antd/locale-zh-cn.js"></script>
<script src="./lib/react-antd/antd-with-locales.min.js"></script>
<script src="./lib/react-antd/echarts.min.js"></script>
<script src="./lib/react-antd/babel.min.js"></script>

<script type="text/babel" data-presets="react">
  const { useState, useMemo, useRef, useEffect } = React;
  const {
    Layout, Menu, Breadcrumb, ConfigProvider, Avatar, Badge, Button, Space, Card,
    Statistic, Row, Col, Table, Tag, Form, Input, Select, DatePicker, InputNumber,
    Radio, Descriptions, Result, Divider,
  } = window.antd;
  const { Sider, Header, Content } = Layout;
  const zhCN = (window.antd && (window.antd.zhCN || (window.antd.locale && (window.antd.locale.zh_CN || window.antd.locale.zhCN)))) || undefined;
  dayjs.locale('zh-cn');

  // ============ Arco 风格图表主题（ECharts） ============
  // Arco 无官方图表库；Arco Design Pro 官方用 ECharts。以下配置复刻 Arco 图表观感：
  // 主色 #165DFF 系、浅灰网格线 #E5E6EB、文字 #4E5969、极简无阴影。
  const ARCO_COLORS = ['#165DFF', '#0FC6C2', '#FFC72E', '#F53F3F', '#00B42A', '#FF7D00', '#722ED1', '#3491FA'];
  const ARCO_AXIS = {
    axisLine: { lineStyle: { color: '#E5E6EB' } },
    axisTick: { show: false },
    axisLabel: { color: '#4E5969', fontSize: 12 },
    splitLine: { lineStyle: { color: '#E5E6EB', width: 1 } },
  };

  // ECharts React 封装：挂载/自适应/销毁。option 需用 useMemo 保持引用稳定。
  function Chart({ option, height = 260 }) {
    const ref = useRef(null);
    useEffect(() => {
      const chart = echarts.init(ref.current);
      chart.setOption(option);
      const onResize = () => chart.resize();
      window.addEventListener('resize', onResize);
      return () => { window.removeEventListener('resize', onResize); chart.dispose(); };
    }, [option]);
    return <div ref={ref} style={{ width: '100%', height }} />;
  }

  // ============ 菜单与页面注册（按 Design 修改） ============
  // key 是页面标识，label 是菜单显示名。页面组件在下方定义后注册进 PAGES。
  const MENU_ITEMS = [
    { key: 'workplace', label: '工作台' },
    { key: 'list', label: '列表页' },
    { key: 'form', label: '表单页' },
    { key: 'detail', label: '详情页' },
    { key: 'dashboard', label: '数据看板' },
    { key: 'result', label: '结果页' },
    { key: 'exception', label: '异常页' },
  ];

  // ============ 页面骨架：按 Design 填充业务内容 ============

  // 聚合页：KPI 统计卡片 + 待办/列表区块
  function PageWorkplace() {
    return (
      <div>
        <div className="page-head">
          <h2 className="page-title">工作台</h2>
          <p className="page-sub">运营概览与待办</p>
        </div>
        <Row gutter={16}>
          <Col span={6}><Card className="stat-card"><Statistic title="指标一" value={0} /></Card></Col>
          <Col span={6}><Card className="stat-card"><Statistic title="指标二" value={0} /></Card></Col>
          <Col span={6}><Card className="stat-card"><Statistic title="指标三" value={0} /></Card></Col>
          <Col span={6}><Card className="stat-card"><Statistic title="指标四" value={0} /></Card></Col>
        </Row>
        <Card title="待办事项" style={{ marginTop: 16 }}>
          {/* 按 Design 填充表格/列表 */}
        </Card>
      </div>
    );
  }

  // 列表页：查询区 + 操作区 + 表格 + 分页
  function PageList() {
    return (
      <div>
        <div className="page-head">
          <h2 className="page-title">列表页</h2>
          <p className="page-sub">支持查询、筛选与分页</p>
        </div>
        <Card>
          <Form layout="inline">
            {/* 按 Design 填充查询字段 */}
            <Form.Item label="查询条件"><Input placeholder="请输入" allowClear /></Form.Item>
            <Form.Item>
              <Space><Button type="primary">查询</Button><Button>重置</Button></Space>
            </Form.Item>
          </Form>
          <Divider style={{ margin: '12px 0' }} />
          <div className="toolbar">
            <Space>
              <Button type="primary">新建</Button>
              <Button>导出</Button>
            </Space>
          </div>
          {/* 按 Design 填充 columns/dataSource */}
          <Table columns={[]} dataSource={[]} size="middle"
            pagination={{ pageSize: 10, showTotal: (t) => `共 ${t} 条`, showSizeChanger: false }} />
        </Card>
      </div>
    );
  }

  // 表单页：卡片分组 + 栅格列 + 底部操作
  function PageForm() {
    return (
      <div>
        <div className="page-head">
          <h2 className="page-title">表单页</h2>
          <p className="page-sub">分组填写</p>
        </div>
        <Form layout="vertical" style={{ maxWidth: 960 }}>
          <Card title="基本信息" style={{ marginBottom: 16 }}>
            <Row gutter={24}>
              <Col span={8}>
                <Form.Item label="字段" name="f1" rules={[{ required: true, message: '请输入' }]}>
                  <Input placeholder="请输入" />
                </Form.Item>
              </Col>
            </Row>
          </Card>
          <div style={{ textAlign: 'right' }}>
            <Space>
              <Button>取消</Button>
              <Button type="primary" htmlType="submit">保存</Button>
            </Space>
          </div>
        </Form>
      </div>
    );
  }

  // 详情页：信息描述 + 关联子表
  function PageDetail() {
    return (
      <div>
        <div className="page-head">
          <h2 className="page-title">详情页</h2>
          <p className="page-sub">对象详情</p>
        </div>
        <Card title="基本信息" style={{ marginBottom: 16 }}>
          {/* 按 Design 填充 descriptions items */}
          <Descriptions bordered column={2} items={[]} />
        </Card>
        <Card title="关联明细">
          <Table columns={[]} dataSource={[]} pagination={false} size="middle" />
        </Card>
      </div>
    );
  }

  // 数据看板页：KPI 卡片 + 图表区块（ECharts，Arco 风格）
  function PageDashboard() {
    // 按 Design 替换数据
    const trendOption = useMemo(() => ({
      color: ARCO_COLORS,
      tooltip: { trigger: 'axis' },
      grid: { left: 12, right: 16, top: 24, bottom: 8, containLabel: true },
      xAxis: { type: 'category', data: ['06-13', '06-15', '06-17', '06-19', '06-21', '06-23', '06-25', '06-27', '06-29', '07-01', '07-03', '07-05'], ...ARCO_AXIS },
      yAxis: { type: 'value', ...ARCO_AXIS },
      series: [{
        name: '趋势', type: 'line', smooth: true,
        data: [820, 932, 901, 934, 1290, 1330, 1320, 1150, 1240, 1380, 1420, 1500],
        itemStyle: { color: '#165DFF' }, lineStyle: { width: 2 },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [{ offset: 0, color: 'rgba(22,93,255,0.25)' }, { offset: 1, color: 'rgba(22,93,255,0.02)' }] } },
      }],
    }), []);
    const pieOption = useMemo(() => ({
      color: ARCO_COLORS,
      tooltip: { trigger: 'item' },
      legend: { bottom: 0, icon: 'circle', itemWidth: 8, itemHeight: 8, textStyle: { color: '#4E5969', fontSize: 12 } },
      series: [{
        type: 'pie', radius: ['45%', '70%'], center: ['50%', '42%'],
        label: { color: '#4E5969', fontSize: 12 },
        data: [ // 按 Design 替换占比数据
          { name: '微信小程序', value: 42 },
          { name: 'App', value: 28 },
          { name: 'Web', value: 18 },
          { name: '其他', value: 12 },
        ],
      }],
    }), []);
    return (
      <div>
        <div className="page-head">
          <h2 className="page-title">数据看板</h2>
          <p className="page-sub">运营趋势</p>
        </div>
        <Row gutter={16}>
          <Col span={6}><Card className="stat-card"><Statistic title="指标一" value={0} /></Card></Col>
          <Col span={6}><Card className="stat-card"><Statistic title="指标二" value={0} /></Card></Col>
          <Col span={6}><Card className="stat-card"><Statistic title="指标三" value={0} /></Card></Col>
          <Col span={6}><Card className="stat-card"><Statistic title="指标四" value={0} /></Card></Col>
        </Row>
        <Row gutter={16} style={{ marginTop: 16 }}>
          <Col span={16}><Card title="趋势图"><Chart option={trendOption} height={260} /></Card></Col>
          <Col span={8}><Card title="占比"><Chart option={pieOption} height={260} /></Card></Col>
        </Row>
      </div>
    );
  }

  // 结果页：操作结果反馈
  function PageResult() {
    return (
      <Card style={{ maxWidth: 720, margin: '40px auto' }}>
        <Result status="success" title="操作成功" sub-title="提交已生效。"
          extra={<Space>
            <Button type="primary">继续操作</Button>
            <Button>返回列表</Button>
          </Space>} />
      </Card>
    );
  }

  // 异常页：无权限/404/500/空数据
  function PageException() {
    return (
      <Card style={{ maxWidth: 720, margin: '40px auto' }}>
        <Result status="404" title="404" sub-title="抱歉，您访问的页面不存在。"
          extra={<Button type="primary">返回工作台</Button>} />
      </Card>
    );
  }

  const PAGES = {
    workplace: PageWorkplace,
    list: PageList,
    form: PageForm,
    detail: PageDetail,
    dashboard: PageDashboard,
    result: PageResult,
    exception: PageException,
  };

  // ============ 壳层（一般不需要改） ============
  function App() {
    const [current, setCurrent] = useState('workplace');
    const [collapsed, setCollapsed] = useState(false);
    const Page = PAGES[current] || PageWorkplace;

    return (
      <ConfigProvider locale={zhCN}>
        <Layout style={{ height: '100%' }}>
          <Sider theme="dark" width={220} collapsible collapsed={collapsed} onCollapse={setCollapsed}>
            <div className="sider-logo">{collapsed ? 'SP' : '__PROJECT_NAME__'}</div>
            <Menu theme="dark" mode="inline" selectedKeys={[current]}
              onClick={({ key }) => setCurrent(key)} items={MENU_ITEMS} />
          </Sider>
          <Layout>
            <Header className="header-bar" style={{ height: 64, lineHeight: '64px' }}>
              <Breadcrumb items={[{ title: '首页' }, { title: (MENU_ITEMS.find((i) => i.key === current) || {}).label || '' }]} />
              <Space size={16}>
                <Badge count={0}><Avatar style={{ backgroundColor: '#1677ff' }}>U</Avatar></Badge>
                <Button type="link">退出</Button>
              </Space>
            </Header>
            <Content className="content-wrap">
              <Page />
              <div className="footer-note">__PROJECT_NAME__ · 原型 · React 18 + Ant Design 6.5.4 · 无构建 · 双击即用</div>
            </Content>
          </Layout>
        </Layout>
      </ConfigProvider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
